---
# Drone do MBZIRC (quadricóptero) pousado na plataforma (topo em z = 1.0 m).
model_name: 'drone'
model_type: 'mbzirc_quadrotor'
flight_time: 30          # minutos de bateria
position:
  xyz: [0, 0, 1.05]
  rpy: [0, 0, 0]
payload:
  slot0:
    sensor: 'mbzirc_hd_camera'
    rpy: [0, 0, 0]
  slot1:
    sensor: 'mbzirc_3d_lidar'
    rpy: [0, 0, 0]
  slot2:
    sensor: 'None'
    rpy: [0, 0, 0]
  slot3:
    sensor: 'None'
    rpy: [0, 0, 0]
  slot4:
    sensor: 'None'
    rpy: [0, 0, 0]
  slot5:
    sensor: 'None'
    rpy: [0, 0, 0]
  slot6:
    sensor: 'None'
    rpy: [0, 0, 0]
  slot7:
    sensor: 'None'
    rpy: [0, 0, 0]
